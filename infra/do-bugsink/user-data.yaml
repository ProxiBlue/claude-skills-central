#cloud-config
# Bugsink error-tracker droplet — fully self-configuring (AP-2, 2026-08-03).
# Paste as User Data when creating the droplet. On first boot it installs
# docker, boots bugsink behind caddy (auto-TLS), and enables unattended
# security upgrades. Nothing to run by hand on the server.
#
# Droplet: Basic 1vCPU/1GB, Ubuntu 24.04 LTS. DNS: bugsink.proxiblue.com.au -> droplet IP.
# NOTE 2026-09-19: the live hostname is bugsink.proxiblue.com.au. It was
# originally deployed as errors.proxiblue.com.au and renamed; the old name still
# has an A record to this same droplet but no cert, so it fails the TLS handshake
# (curl exit 35). Do not reintroduce it -- a stale copy in pvcpipesupplies
# .claude/wires.json blocked every pb-hcf pre-flight until 2026-09-19.

package_update: true
packages:
  - unattended-upgrades

write_files:
  - path: /opt/bugsink/docker-compose.yml
    content: |
      services:
        bugsink:
          image: bugsink/bugsink:latest
          restart: always
          environment:
            # Secrets are substituted by docker compose from /opt/bugsink/.env,
            # which is created out-of-band and never committed. See README.md.
            SECRET_KEY: "${BUGSINK_SECRET_KEY:?create /opt/bugsink/.env first}"
            CREATE_SUPERUSER: "${BUGSINK_SUPERUSER:?create /opt/bugsink/.env first}"
            PORT: "8000"
            BASE_URL: "https://bugsink.proxiblue.com.au"
            BEHIND_HTTPS_PROXY: "true"
            # No email by design -- see README "Notification model".
          volumes:
            - bugsink_data:/data
          expose:
            - "8000"
        caddy:
          image: caddy:2
          restart: always
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - /opt/bugsink/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
      volumes:
        bugsink_data:
        caddy_data:
        caddy_config:
  - path: /opt/bugsink/Caddyfile
    content: |
      bugsink.proxiblue.com.au {
          reverse_proxy bugsink:8000
      }

runcmd:
  - curl -fsSL https://get.docker.com | sh
  # 1GB swap: the droplet is 512MB and bugsink alone sits at ~405MB. Without
  # swap the kernel OOM-kills bugsink's own snappea ingest worker on every
  # boot and events stop being digested (observed 2026-09-25).
  - fallocate -l 1G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - echo 'vm.swappiness=20' > /etc/sysctl.d/99-swap.conf
  - sysctl -p /etc/sysctl.d/99-swap.conf
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - cd /opt/bugsink && docker compose up -d
